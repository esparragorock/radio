<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Espárrago Rock</title>
    <style>
        /* Reset de estilos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Encabezado */
        header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #0f0;
            width: 100%;
        }

        header img {
            width: 300px;
            max-width: 90%;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            color: #0f0;
            font-size: 2em;
        }

        /* Sección principal */
        main {
            background-color: #111;
            padding: 20px;
            border: 2px solid #0f0;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .control-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0f0;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-button:hover {
            background-color: #0c0;
            transform: scale(1.1);
        }

        .control-button:disabled {
             background-color: #555;
             cursor: not-allowed;
             transform: scale(1);
        }

        .playButton svg,
        .stopButton svg {
            width: 30px;
            height: 30px;
            fill: #000; /* Negro sobre verde */
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .volume-control i {
            font-size: 20px;
            color: #fff;
            width: 25px;
            text-align: center;
        }

        .volume-control input[type="range"] {
            width: 120px;
            height: 8px;
            cursor: pointer;
            -webkit-appearance: none;
            background: #333;
            outline: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
         .volume-control input[type="range"]:hover {
             background: #444;
         }

        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }
         .volume-control input[type="range"]::-webkit-slider-thumb:hover {
             background: #0c0;
         }

        .volume-control input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
            border: none;
             transition: background 0.3s ease;
        }
         .volume-control input[type="range"]::-moz-range-thumb:hover {
            background: #0c0;
        }

        .volume-control span {
            font-size: 14px;
            min-width: 40px;
            text-align: right;
        }

        .current-song {
            margin-top: 20px;
            text-align: center;
        }

        .current-song h2 {
            color: #0f0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .current-song h3 { /* Título */
            font-size: 1.6em;
            color: #fff;
            margin-bottom: 5px;
            min-height: 1.6em;
        }

        .current-song p { /* Artista */
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 5px;
             min-height: 1.2em;
        }

        /* Sección Recientes */
        .recent-songs {
            margin-top: 40px;
        }

        .recent-songs h2 {
            color: #0f0;
            margin-bottom: 15px;
            text-align: center;
             font-size: 1.2em;
        }

        #recentSongsList {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            color: #fff;
        }

        #recentSongsList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 5px;
            border-bottom: 1px solid #333;
            transition: background-color 0.2s ease;
        }
         #recentSongsList li:hover {
             background-color: #222;
         }

        #recentSongsList li:last-child {
            border-bottom: none;
        }

        .song-data {
            flex-grow: 1;
        }
        .song-data p {
            margin: 0;
            line-height: 1.4;
        }
        .song-data p strong {
             color: #fff;
             font-size: 1.1em;
        }
        .song-data p:last-child {
             color: #aaa;
             font-size: 0.9em;
        }

        #recentSongsList li .song-time {
            color: #888;
            font-size: 0.85em;
            white-space: nowrap;
            flex-shrink: 0;
        }
         #recentSongsList li.empty-message {
             justify-content: center;
             color: #888;
             font-style: italic;
             border-bottom: none;
             padding: 20px 5px;
         }
         #recentSongsList li.empty-message:hover {
             background-color: transparent;
         }


        /* Pie de página */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #111;
            border-top: 2px solid #0f0;
            margin-top: 30px;
            width: 100%;
        }

        footer h3 {
            color: #0f0;
            margin-bottom: 10px;
        }
        footer p {
            color: #ccc;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 10px; /* Añadir espacio debajo de cada párrafo del footer */
        }
        /* Estilo para el enlace de email */
        footer p.email-contact {
             margin-top: 15px; /* Espacio extra antes del email */
             font-size: 0.9em;
        }
        footer p.email-contact i { /* Icono de email */
            margin-right: 8px; /* Espacio entre icono y texto */
            color: #0f0; /* Color verde para el icono */
        }
         footer p.email-contact a { /* Enlace de email */
             color: #eee; /* Color blanco/gris claro para el email */
             text-decoration: none;
             transition: color 0.3s ease;
         }
          footer p.email-contact a:hover {
              color: #0f0; /* Color verde al pasar el ratón */
              text-decoration: underline;
          }


        /* Media Query para pantallas pequeñas */
        @media (max-width: 600px) {
             header img { width: 200px; }
             header h1 { font-size: 1.5em; }
             main { width: 95%; padding: 15px; }
             .current-song h3 { font-size: 1.3em; }
             .current-song p { font-size: 1em; }
             #recentSongsList li {
                 flex-direction: column;
                 align-items: flex-start;
                 gap: 5px;
             }
             #recentSongsList li .song-time {
                 margin-top: 5px;
                 align-self: flex-end;
             }
              #recentSongsList li.empty-message {
                  align-items: center;
              }
        }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <img src="https://i.postimg.cc/4xxPrBM9/la-esparragorock5.png" alt="Logo Espárrago Rock Radio">
        <h1>LA ESPÁRRAGO ROCK</h1>
    </header>

    <main>
        <section class="controls">
             <button id="playButton" class="control-button playButton" title="Reproducir">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
            </button>
            <button id="stopButton" class="control-button stopButton" title="Detener" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M0 128C0 92.7 28.7 64 64 64H320c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z"/></svg>
            </button>
            <div class="volume-control">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" title="Control de volumen">
                <span id="volumeLabel">80%</span>
            </div>
        </section>

        <section class="current-song">
            <h2>SONANDO AHORA:</h2>
            <h3 id="songTitle">Cargando...</h3>
            <p id="artistName">Espárrago Rock Radio</p>
        </section>

        <section class="recent-songs">
            <h2>HISTORIAL RECIENTE</h2>
            <ul id="recentSongsList">
                <li class="empty-message">El historial aparecerá aquí...</li>
            </ul>
        </section>
    </main>

    <footer>
        <h3>LA ESPÁRRAGO ROCK</h3>
        <p>Emisora tributo al Festival Espárrago Rock<br>¡Rock 24/7 desde Granada, España!</p>
        <p style="font-size: 0.8em; color: #666;">© <span id="currentYear"></span> La Espárrago Rock</p>
        <p class="email-contact">
            <i class="fas fa-envelope"></i> <a href="mailto:esparragorock.com@gmail.com">esparragorock.com@gmail.com</a>
        </p>
    </footer>

    <audio id="audioPlayer" preload="none">
        <source src="https://uk2freenew.listen2myradio.com/live.mp3?typeportmount=s2_10718_stream_544876668" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio. Prueba con otro navegador.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- Elementos del DOM ---
            const playButton = document.getElementById('playButton');
            const stopButton = document.getElementById('stopButton');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeLabel = document.getElementById('volumeLabel');
            const songTitle = document.getElementById('songTitle');
            const artistName = document.getElementById('artistName');
            const recentSongsList = document.getElementById('recentSongsList');
            const audioPlayer = document.getElementById('audioPlayer');
            const volumeIcon = document.querySelector('.volume-control i');
            const currentYearElement = document.getElementById('currentYear');

            // --- Estado y Datos Globales ---
            let isPlaying = false;
            audioPlayer.volume = parseFloat(volumeSlider.value);
            let songHistory = [];
            let lastAddedSongId = null;
            const MAX_HISTORY = 5;

            // --- FUNCIÓN PARA RENDERIZAR EL HISTORIAL ---
            function renderHistory() {
                recentSongsList.innerHTML = '';
                if (songHistory.length === 0) {
                    recentSongsList.innerHTML = '<li class="empty-message">El historial aparecerá aquí...</li>';
                    return;
                }
                songHistory.forEach(song => {
                    const listItem = document.createElement('li');
                    const songData = document.createElement('div');
                    songData.className = 'song-data';
                    songData.innerHTML = `<p><strong>${song.title}</strong></p><p>${song.artist || ' '}</p>`;
                    const songTime = document.createElement('span');
                    songTime.className = 'song-time';
                    songTime.textContent = song.time.toLocaleTimeString(navigator.language || 'es-ES', { hour: '2-digit', minute: '2-digit' });
                    listItem.appendChild(songData);
                    listItem.appendChild(songTime);
                    recentSongsList.appendChild(listItem);
                });
            }


            // --- FUNCIÓN PARA OBTENER METADATOS Y ACTUALIZAR HISTORIAL ---
            async function fetchRadioData() {
                try {
                    console.log("Intentando obtener metadatos desde /7.html vía allorigins...");
                    const targetApiUrl = "http://uk2freenew.listen2myradio.com:10718/7.html";
                    const proxiedUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApiUrl)}`;
                    // console.log("URL de la petición:", proxiedUrl); // Descomentar para depurar URL

                    const response = await fetch(proxiedUrl, { cache: "no-store" });

                    if (!response.ok) {
                         if (response.status === 404) throw new Error(`El endpoint /7.html no existe (Error 404)`);
                         else throw new Error(`Error en petición proxy/API: ${response.status} ${response.statusText}`);
                    }

                    const htmlBody = await response.text();
                    // console.log("Respuesta recibida (texto):", htmlBody); // Descomentar para depurar respuesta

                    const bodyContentMatch = htmlBody.match(/<body>(.*?)<\/body>/i);
                    let dataString = "";
                    if (bodyContentMatch && bodyContentMatch[1]) dataString = bodyContentMatch[1];
                    else if (htmlBody.includes(',')) dataString = htmlBody.trim();
                    else throw new Error("Respuesta de /7.html no parseable.");

                    const parts = dataString.split(',');
                    let currentSongData = "Información no disponible";
                    if (parts.length >= 7) currentSongData = parts.slice(6).join(',').trim();
                    else if (parts.length === 1 && parts[0] !== "") currentSongData = parts[0].trim();
                    else if (htmlBody.toLowerCase().includes("offline")) currentSongData = "Stream Offline";

                    let fetchedTitle = "Canción Desconocida";
                    let fetchedArtist = "Artista Desconocido";
                    if (currentSongData && currentSongData !== "Información no disponible" && currentSongData !== "Stream Offline") {
                        const separator = " - ";
                        const separatorIndex = currentSongData.indexOf(separator);
                        if (separatorIndex !== -1) {
                            fetchedArtist = currentSongData.substring(0, separatorIndex).trim();
                            fetchedTitle = currentSongData.substring(separatorIndex + separator.length).trim();
                        } else {
                            fetchedTitle = currentSongData;
                        }
                    } else if (currentSongData === "Stream Offline") {
                         fetchedTitle = "Radio Offline";
                         fetchedArtist = "";
                    }

                     if (fetchedTitle.toLowerCase().includes("unknown") || fetchedTitle.includes("Stream Title") || fetchedTitle.startsWith("Listen2MyRadio")) {
                          fetchedTitle = "Radio Online";
                          fetchedArtist = "Espárrago Rock";
                     }

                    // console.log(`Parseado: Artista='${fetchedArtist}', Título='${fetchedTitle}'`); // Descomentar para depurar parseo

                    const fetchedId = `${fetchedArtist} - ${fetchedTitle}`;
                    const isValidSong = fetchedTitle !== "Canción Desconocida" && fetchedTitle !== "Radio Online" && fetchedTitle !== "Radio Offline";

                    songTitle.textContent = fetchedTitle;
                    artistName.textContent = fetchedArtist;

                    if (isValidSong && fetchedId !== lastAddedSongId) {
                        // console.log(`Nueva canción detectada para historial: ${fetchedId}`); // Descomentar para depurar historial
                        songHistory.unshift({ title: fetchedTitle, artist: fetchedArtist, time: new Date() });
                        lastAddedSongId = fetchedId;
                        if (songHistory.length > MAX_HISTORY) songHistory = songHistory.slice(0, MAX_HISTORY);
                        renderHistory();
                    }

                } catch (error) {
                    console.error("Error detallado al cargar metadatos:", error);
                    songTitle.textContent = "Radio Online";
                    artistName.textContent = "Espárrago Rock";
                    renderHistory();
                }
            }


            // --- FUNCIONES DE CONTROL DE REPRODUCCIÓN ---
            function startPlayback() {
                if (!isPlaying) {
                    audioPlayer.play()
                        .then(() => {
                            isPlaying = true; playButton.disabled = true; stopButton.disabled = false; console.log("Reproducción iniciada");
                        })
                        .catch(error => {
                            console.error("Error al iniciar la reproducción:", error);
                            alert("No se pudo iniciar la reproducción. Verifica tu conexión o si el stream está activo.");
                            isPlaying = false; playButton.disabled = false; stopButton.disabled = true;
                        });
                }
            }

            function stopPlayback() {
                if (isPlaying) {
                    audioPlayer.pause(); isPlaying = false; playButton.disabled = false; stopButton.disabled = true; console.log("Reproducción detenida");
                }
            }

             // --- MANEJO DE EVENTOS ---
            playButton.addEventListener('click', startPlayback);
            stopButton.addEventListener('click', stopPlayback);

            volumeSlider.addEventListener('input', () => {
                const volume = parseFloat(volumeSlider.value);
                audioPlayer.volume = volume;
                volumeLabel.textContent = `${Math.round(volume * 100)}%`;
                if (volumeIcon) {
                    if (volume === 0) { volumeIcon.className = 'fas fa-volume-mute'; }
                    else if (volume < 0.5) { volumeIcon.className = 'fas fa-volume-down'; }
                    else { volumeIcon.className = 'fas fa-volume-up'; }
                }
            });

             if (currentYearElement) { currentYearElement.textContent = new Date().getFullYear(); }

            // --- INICIALIZACIÓN ---
            renderHistory();
            fetchRadioData();
            setInterval(fetchRadioData, 15000); // Actualizar cada 15 seg
        });
    </script>
</body>
</html>
